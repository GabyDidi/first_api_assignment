services:
    api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: your_database_url_here
      SUPABASE_URL: your_supabase_url_here
      SUPABASE_KEY: your_supabase_key_here
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: tasks
    volumes:
      - taskdata:/var/lib/postgresql/data

volumes:
  taskdata: